amcl:
  ros__parameters:
    use_sim_time: true
    robot_model_type: nav2_amcl::DifferentialMotionModel
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose: {plugin: nav2_bt_navigator::NavigateToPoseNavigator}
    navigate_through_poses: {plugin: nav2_bt_navigator::NavigateThroughPosesNavigator}

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    odom_topic: /odom
    controller_frequency: 20.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: nav2_controller::SimpleProgressChecker, required_movement_radius: 0.2, movement_time_allowance: 10.0}
    goal_checker: {plugin: nav2_controller::SimpleGoalChecker, xy_goal_tolerance: 0.15, yaw_goal_tolerance: 0.15, stateful: true}
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      max_vel_x: 0.4
      min_vel_x: -0.2
      max_vel_theta: 0.8
      acc_lim_x: 0.8
      acc_lim_theta: 1.5
      decel_lim_x: -0.8
      decel_lim_theta: -1.5
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.7
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle: {scale: 0.02}
      PathAlign: {scale: 32.0, forward_point_distance: 0.1}
      GoalAlign: {scale: 24.0, forward_point_distance: 0.1}
      PathDist: {scale: 32.0}
      GoalDist: {scale: 24.0}
      RotateToGoal: {scale: 32.0, slowing_factor: 5.0, lookahead_time: -1.0}

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.4,0.3],[0.4,-0.3],[-0.4,-0.3],[-0.4,0.3]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan, data_type: LaserScan, clearing: true, marking: true, obstacle_max_range: 8.0, raytrace_max_range: 10.0}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.45, cost_scaling_factor: 3.0}

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.4,0.3],[0.4,-0.3],[-0.4,-0.3],[-0.4,0.3]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer: {plugin: nav2_costmap_2d::StaticLayer, map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan, data_type: LaserScan, clearing: true, marking: true, obstacle_max_range: 8.0, raytrace_max_range: 10.0}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.45, cost_scaling_factor: 3.0}

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased: {plugin: nav2_navfn_planner::NavfnPlanner, tolerance: 0.25, use_astar: false, allow_unknown: true}

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother: {plugin: nav2_smoother::SimpleSmoother, tolerance: 1.0e-10, max_its: 1000, do_refinement: true}

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    drive_on_heading: {plugin: nav2_behaviors::DriveOnHeading}
    wait: {plugin: nav2_behaviors::Wait}

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: nav2_waypoint_follower::WaitAtWaypoint, enabled: true, waypoint_pause_duration: 200}

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.4, 0.0, 0.8]
    min_velocity: [-0.2, 0.0, -0.8]
    max_accel: [0.8, 0.0, 1.5]
    max_decel: [-0.8, 0.0, -1.5]
    odom_topic: /odom
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /diff_drive_controller/cmd_vel
    polygons: [FootprintApproach]
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true

map_server:
  ros__parameters: {use_sim_time: true}

route_server:
  ros__parameters: {use_sim_time: true}

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    dock_plugins: [simple_charging_dock]
    simple_charging_dock: {plugin: opennav_docking::SimpleChargingDock}
